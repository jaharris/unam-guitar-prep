name: Build curated podcast feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'feed.template.xml'
      - 'build_feed.py'
      - '.github/workflows/build-feed.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build feed and resolve Apple-listed podcast audio
        run: python build_feed.py --template feed.template.xml --output feed.xml --report feed_build_report.txt

      - name: Show build report
        run: cat feed_build_report.txt

      - name: Commit generated feed if changed
        run: |
          if git diff --quiet -- feed.xml feed_build_report.txt; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml feed_build_report.txt
          git commit -m "Refresh curated podcast feed"
          git push
